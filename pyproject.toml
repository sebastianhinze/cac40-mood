[project]
name = "cac40-mood"
version = "0.1.0"
description = "Does the tone of official CAC 40 announcements predict abnormal returns and volatility beyond a HAR/GARCH baseline?"
readme = "README.md"
authors = [
    { name = "Sebastian Hinze", email = "269407894+86kdvt9c4f-collab@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "arch",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "pypdfium2>=5.15.2",
    "python-dotenv",
    "requests",
    "scipy",
    "statsmodels",
    "yfinance",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest",
    "ruff",
]
app = [
    "plotly",
    "streamlit",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs internet access (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Notebooks hold long chart captions and display calls, so the line-length rule is off there.
"notebooks/**" = ["ANN", "E501"]
